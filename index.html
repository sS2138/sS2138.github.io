<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sS2138 的主页</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .card {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 20px;
      padding: 48px 56px;
      max-width: 520px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }
    .avatar {
      width: 96px; height: 96px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.25);
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 40px; font-weight: 700; margin-bottom: 20px;
      border: 3px solid rgba(255, 255, 255, 0.5);
    }
    h1 { font-size: 26px; margin-bottom: 8px; }
    .handle { color: rgba(255, 255, 255, 0.85); margin-bottom: 20px; font-size: 15px; }
    p.desc { line-height: 1.7; color: rgba(255, 255, 255, 0.92); margin-bottom: 28px; font-size: 15px; }
    .badge {
      display: inline-block; background: rgba(255, 255, 255, 0.2);
      padding: 6px 14px; border-radius: 999px; font-size: 13px; margin: 4px;
    }
    a.footer-link { color: #e2e8f0; font-size: 13px; text-decoration: none; }
    a.footer-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">S</div>
    <h1>欢迎来到我的主页</h1>
    <div class="handle">@sS2138 · GitHub Pages</div>
    <p class="desc">
      这是我通过 GitHub Pages 免费托管的个人网站。
      <br>本站完全免费，由 GitHub 提供全球加速。
    </p>
    <div>
      <span class="badge">✨ 免费托管</span>
      <span class="badge">🌍 全球访问</span>
      <span class="badge">🔒 HTTPS</span>
    </div>
  </div>
</body>
</html>
